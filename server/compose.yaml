services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: jay
      POSTGRES_USER: jay
      POSTGRES_PASSWORD: jay
    volumes:
      - jay_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jay -d jay"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py migrate --noinput
    environment: &environment
      DATABASE_URL: postgresql://jay:jay@postgres:5432/jay
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for the local deployment}
      PUBLIC_URL: http://127.0.0.1:8000
      SHARED_SOUND_ACCESS: ${SHARED_SOUND_ACCESS:-play}
      ALLOWED_HOSTS: localhost,127.0.0.1

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      <<: *environment
      DATABASE_POOL_SIZE: 8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3

  worker:
    build: .
    command: python manage.py run_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *environment
      DATABASE_POOL_SIZE: 6

volumes:
  jay_postgres:
