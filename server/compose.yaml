services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: jay
      POSTGRES_USER: jay
      POSTGRES_PASSWORD: jay
    volumes:
      - jay_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jay -d jay"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jay:jay@postgres:5432/jay
      PUBLIC_URL: http://127.0.0.1:8000
      SHARED_SOUND_ACCESS: ${SHARED_SOUND_ACCESS:-play}

volumes:
  jay_postgres:
