name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          tool_versions: |
            python 3.11.14
            postgres 18.6

      - name: Install server dependencies
        working-directory: server
        run: |
          mise exec -- python -m venv .venv
          mise exec -- .venv/bin/python -m pip install --require-hashes -r requirements-test.lock
          mise exec -- .venv/bin/python -m pip install --no-deps -e .

      - name: Test server with disposable PostgreSQL
        run: mise exec -- bash server/test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and compile
        run: ./gradlew testDebugUnitTest assembleDebug compileReleaseKotlin --no-daemon
