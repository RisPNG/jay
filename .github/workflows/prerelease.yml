name: Prerelease

on:
  push:
    branches:
      - jay

jobs:
  prerelease:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_jayFirebaseProjectId: ${{ secrets.FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_jayFirebaseApiKey: ${{ secrets.FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_jayFirebaseDebugApplicationId: ${{ secrets.FIREBASE_DEBUG_APPLICATION_ID }}
      ORG_GRADLE_PROJECT_jaySigningStorePassword: ${{ secrets.PRERELEASE_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_jaySigningKeyAlias: ${{ secrets.PRERELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_jaySigningKeyPassword: ${{ secrets.PRERELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore prerelease signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PRERELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/jay-prerelease.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          printf 'ORG_GRADLE_PROJECT_jaySigningStoreFile=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          version_name=$(awk -F= '$1 == "jayVersionName" { print $2 }' gradle.properties)
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          short_sha=${GITHUB_SHA:0:7}
          ./gradlew testDebugUnitTest assembleDebug \
            -PjayVersionCode="$version_code" \
            -PjayVersionName="${version_name}-pre.${GITHUB_RUN_NUMBER}.${short_sha}" \
            --no-daemon

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(awk -F= '$1 == "jayVersionName" { print $2 }' gradle.properties)
          short_sha=${GITHUB_SHA:0:7}
          artifact_name="jay-${version_name}-prerelease-${short_sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$artifact_name"
          gh release create "prerelease-${short_sha}" "$artifact_name" \
            --target "$GITHUB_SHA" \
            --title "$short_sha" \
            --notes "Automated prerelease for commit ${GITHUB_SHA}." \
            --prerelease
