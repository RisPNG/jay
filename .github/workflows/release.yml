name: Release

on:
  push:
    branches:
      - jay

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_jayFirebaseProjectId: ${{ secrets.FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_jayFirebaseApiKey: ${{ secrets.FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PRODUCTION_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/jay-production.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

      - name: Restore prerelease signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PRERELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/jay-prerelease.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

      - name: Test and build release
        env:
          ORG_GRADLE_PROJECT_jayFirebaseReleaseApplicationId: ${{ secrets.FIREBASE_RELEASE_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_jaySigningStoreFile: ${{ runner.temp }}/jay-production.jks
          ORG_GRADLE_PROJECT_jaySigningStorePassword: ${{ secrets.PRODUCTION_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_jaySigningKeyAlias: ${{ secrets.PRODUCTION_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_jaySigningKeyPassword: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_jayFirebaseDebugApplicationId: ${{ secrets.FIREBASE_DEBUG_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_jaySigningStoreFile: ${{ runner.temp }}/jay-prerelease.jks
          ORG_GRADLE_PROJECT_jaySigningStorePassword: ${{ secrets.PRERELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_jaySigningKeyAlias: ${{ secrets.PRERELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_jaySigningKeyPassword: ${{ secrets.PRERELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(awk -F= '$1 == "jayVersionName" { print $2 }' gradle.properties)
          commit_subject=$(git log -1 --pretty=%s)
          release_title=$(printf '%s\n' "$commit_subject" | awk '{ print $1, $2 }')
          apk_name="jay-${version_name}.apk"
          debug_apk_name="jay-${version_name}-debug.apk"
          bundle_name="jay-${version_name}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          cp app/build/outputs/apk/debug/app-debug.apk "$debug_apk_name"
          cp app/build/outputs/bundle/release/app-release.aab "$bundle_name"
          gh release create "v${version_name}" "$apk_name" "$debug_apk_name" "$bundle_name" \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --generate-notes \
            --latest

      - name: Remove the prereleases this release settles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 500 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
