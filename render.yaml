services:
  - type: web
    name: jay-server
    runtime: python
    rootDir: server
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn jay_server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jay-postgres
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_PLAY_CREDENTIALS_JSON
        sync: false
      - key: B2_S3_ENDPOINT
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false

databases:
  - name: jay-postgres
